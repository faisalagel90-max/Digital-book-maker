.animation-page{min-height:100vh;background:#171426;color:#fff;padding-bottom:20px}.anim-head{padding:15px 16px;display:flex;align-items:center;gap:10px}.anim-head h2{font-size:19px;margin:0;flex:1}.anim-preview{margin:8px 16px 18px;border-radius:24px;aspect-ratio:9/13;background:linear-gradient(160deg,#f4aa78,#d88983 45%,#263b61);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:0 20px 50px #0006}.anim-sky{position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#fff8 0 4%,transparent 5%),linear-gradient(180deg,#f8c18b,#d88a8c 48%,#324f72);animation:sky 7s ease-in-out infinite alternate}.anim-book{position:relative;width:55%;aspect-ratio:3/4;background:linear-gradient(135deg,#fff7f3,#f8d5e0);border-radius:4px;box-shadow:0 20px 35px #0008;display:grid;place-items:center;color:#3d3142;font-family:Georgia,serif;font-size:20px;text-align:center;padding:18px;animation:bookin 2.2s ease-out both}.anim-controls{margin:0 16px;background:#211d30;border:1px solid #3d374c;border-radius:20px;padding:15px}.control-line{display:flex;justify-content:space-between;align-items:center;margin:11px 0;font-size:12px}.control-line select,.control-line input[type=file]{max-width:60%;background:#2c273b;color:#fff;border:1px solid #494159;border-radius:10px;padding:8px;font-size:10px}.music-card{background:#2c273b;border-radius:15px;padding:12px;margin-top:12px}.music-card b{display:block}.music-actions{display:flex;gap:8px;margin-top:9px}.music-actions button{background:#fff;color:#312c3d;border-radius:10px;padding:8px 11px;font-size:10px}.music-actions .play{background:#8b7cf6;color:#fff}.anim-save{width:100%;margin-top:13px;background:#8b7cf6;color:#fff;padding:13px;border-radius:13px;font-weight:800}

<body><div id="app" class="app"></div><div id="modal" class="hidden"></div>
<script>
'use strict';
const STORE='DBS_FINAL_V1';
const THEMES={
 lavender:{name:'Lavender Dream',bg:'#fff8fb',accent:'#8b7cf6',soft:'#eee9ff',text:'#30293d'},
 romantic:{name:'Romantic',bg:'#fff0f4',accent:'#e86f91',soft:'#ffe0e8',text:'#542c3b'},
 nature:{name:'Nature',bg:'#edf5e9',accent:'#5e9b68',soft:'#dcebd9',text:'#29422e'},
 vintage:{name:'Vintage Journal',bg:'#efe1c6',accent:'#9a6b3f',soft:'#ead4ad',text:'#4d3627'},
 dark:{name:'Dark Night',bg:'#17171c',accent:'#b39cff',soft:'#2b2932',text:'#f7f2ff'},
 cute:{name:'Cute',bg:'#fff5d8',accent:'#ff8d9e',soft:'#ffe7b2',text:'#55323d'},
 elegant:{name:'Elegant',bg:'#f7f5f1',accent:'#8d8069',soft:'#e8e3d9',text:'#292724'},
 modern:{name:'Modern',bg:'#edf3f8',accent:'#4e83c2',soft:'#dbe7f3',text:'#243246'}
};
const TEMPLATES=[
 ['📖','Classic Book','A special chapter','elegant'],['🧷','Scrapbook','Happy moments','cute'],['💗','Love Story','Our story','romantic'],['🎂','Birthday','Happy birthday','cute'],['🏔️','Travel Journal','A journey to remember','nature'],['📸','Photo Album','Beautiful memories','modern'],['📜','Vintage Journal','Notes & memories','vintage'],['✦','Minimalist','Simple & timeless','modern']
];
let state=loadState();
let currentId=null,currentPage=0,selectedId=null,drag=null,undoStack=[],redoStack=[],readerPage=0,audio=null;
const app=document.getElementById('app'),modal=document.getElementById('modal');
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');return x&&Array.isArray(x.books)?x:{books:[]}}catch{return {books:[]}}}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){alert('Penyimpanan perangkat penuh. Coba hapus beberapa buku atau ekspor project.');return false}}
function uid(prefix='id'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeName(v){return (String(v||'digital-book').replace(/[^a-z0-9\- _]/gi,'').trim().replace(/\s+/g,'-')||'digital-book').slice(0,70)}
function getBook(){return state.books.find(b=>b.id===currentId)||null}
function makePage(type,title,theme){return{id:uid('p'),type,title,bg:THEMES[theme].bg,elements:[]}}
function makeBook(title,theme){const b={id:uid('book'),title:title||'Buku Baru',theme,created:Date.now(),updated:Date.now(),pages:[],animation:{background:'sunset',entrance:'rise',transition:'slide',speed:1,coverDuration:2.5},music:null};b.pages=[makePage('cover','Cover Depan',theme),makePage('body','Halaman 1',theme),makePage('back','Cover Belakang',theme)];return b}
function home(){stopAudio();currentId=null;selectedId=null;app.innerHTML=`<div class="screen"><header class="topbar"><div class="brand"><div class="brand-icon">📖</div><div><div class="brand-title">Digital Book <span>Studio</span></div><small class="brand-sub">CREATE · DESIGN · REMEMBER</small></div></div><button class="gear" onclick="showSettings()">⚙️</button></header><section class="hero"><h1>Ubah cerita<br>menjadi buku.</h1><p>Upload foto, pilih gaya, dan buat buku digital langsung dari HP.</p><button class="primary" onclick="createScreen()">＋ Buat Buku Baru</button></section><section class="section"><div class="section-head"><h2>Mulai cepat</h2></div><div class="quick"><button class="quick-card quick-create" onclick="createScreen()"><div class="quick-icon">＋</div><b>Buat Buku Baru</b><small>Mulai karya buku digitalmu dari nol</small></button><button class="quick-card" onclick="templatesScreen()"><div class="quick-icon q-pink">▤</div><b>Template</b></button><button class="quick-card" onclick="themeScreen()"><div class="quick-icon q-pink">🎨</div><b>Auto Theme</b></button><button class="quick-card" onclick="library()"><div class="quick-icon q-yellow">📚</div><b>Perpustakaan</b></button><button class="quick-card" onclick="openUploadFlow()"><div class="quick-icon q-blue">📷</div><b>Upload Foto</b></button><button class="quick-card" onclick="createScreen()"><div class="quick-icon q-blue">✦</div><b>Auto Cover</b></button></div></section><section class="section"><div class="section-head"><h2>Template Populer</h2><button class="section-link" onclick="templatesScreen()">Lihat Semua ›</button></div><div class="template-row">${TEMPLATES.slice(0,6).map((t,i)=>templateCard(t,i)).join('')}</div></section><section class="section"><div class="section-head"><h2>Buku Terbaru</h2><button class="section-link" onclick="library()">Lihat Semua ›</button></div><div class="recent-row">${recentBooks()}</div></section><section class="section"><div class="section-head"><h2>Terakhir Dibuka</h2></div>${lastOpened()}</section></div>${bottomNav('home')}`}
function templateCard(t,i){const th=THEMES[t[3]];return `<button class="template-card" onclick="createFromTemplate(${i})"><div class="template-cover" style="background:${th.bg};color:${th.text}"><div style="font-size:24px">${t[0]}</div><div class="mini-title">${esc(t[1])}<small style="display:block;font:10px system-ui;color:${th.accent};margin-top:8px">${esc(t[2])}</small></div></div><div class="template-name">${esc(t[1])}</div></button>`}
function recentBooks(){if(!state.books.length)return '<div class="empty" style="min-width:100%">Belum ada buku. Pilih template untuk memulai.</div>';return state.books.slice().sort((a,b)=>(b.updated||b.created)-(a.updated||a.created)).slice(0,6).map(b=>{const th=THEMES[b.theme];return `<button class="recent-card" onclick="editBook('${b.id}')"><div class="recent-cover" style="background:${th.bg};color:${th.text}">${esc(b.title)}</div><div class="recent-info"><b>${esc(b.title)}</b><small>${b.pages.length} halaman</small></div></button>`}).join('')}
function lastOpened(){if(!state.books.length)return '<div class="empty">Buku yang terakhir dibuka akan muncul di sini.</div>';const b=state.books.slice().sort((a,b)=>(b.updated||b.created)-(a.updated||a.created))[0],th=THEMES[b.theme];return `<div class="last-open"><div class="last-thumb" style="background:${th.bg};color:${th.text}">${esc(b.title)}</div><div class="grow"><b>${esc(b.title)}</b><small>Diedit baru-baru ini · ${b.pages.length} halaman</small></div><button class="primary" style="padding:10px 13px;font-size:12px" onclick="editBook('${b.id}')">▶ Lanjutkan</button></div>`}
function bottomNav(active){return `<nav class="bottomnav"><button class="navbtn ${active==='home'?'active':''}" onclick="home()"><span class="navico">⌂</span>Beranda</button><button class="navbtn ${active==='templates'?'active':''}" onclick="templatesScreen()"><span class="navico">▤</span>Template</button><button class="navbtn" onclick="createScreen()"><span class="create-fab">＋</span></button><button class="navbtn ${active==='library'?'active':''}" onclick="library()"><span class="navico">▥</span>Perpustakaan</button><button class="navbtn" onclick="showSettings()"><span class="navico">♙</span>Profil</button></nav>`}
function templatesScreen(){app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="home()">‹</button><h2>Template</h2></div><div class="page-content"><div class="template-row" style="flex-wrap:wrap;overflow:visible">${TEMPLATES.map((t,i)=>templateCard(t,i)).join('')}</div></div></div>${bottomNav('templates')}`}
function createFromTemplate(i){const t=TEMPLATES[i];createScreen(t)}
function createScreen(preset=null){const theme=preset?.[3]||'lavender',title=preset?.[1]||'My Little World';app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="home()">‹</button><h2>Buat Buku Baru</h2></div><div class="page-content"><label class="label">Judul buku</label><input id="bookTitle" class="input" value="${esc(title)}"><label class="label">Pilih gaya / Auto Theme</label><div class="theme-grid">${Object.entries(THEMES).map(([k,t])=>`<button class="theme-card ${k===theme?'active':''}" onclick="selectTheme(this,'${k}')"><div class="swatches"><i class="swatch" style="background:${t.bg}"></i><i class="swatch" style="background:${t.accent}"></i><i class="swatch" style="background:${t.soft}"></i></div><b>${t.name}</b></button>`).join('')}</div><input id="bookTheme" type="hidden" value="${theme}"><label class="label">Upload foto (opsional — 1 foto = 1 halaman)</label><input id="bookPhotos" class="input" type="file" accept="image/*" multiple><button class="primary full" onclick="createBookNow()">Buat Buku & Masuk Editor →</button><button class="mini-btn" style="width:100%;margin-top:8px;padding:12px" onclick="importProject()">📥 Import Project</button></div></div>${bottomNav('create')}`}
function selectTheme(el,k){document.querySelectorAll('.theme-card').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('bookTheme').value=k}
function openUploadFlow(){createScreen()}
async function createBookNow(){const title=document.getElementById('bookTitle').value.trim()||'Buku Baru',theme=document.getElementById('bookTheme').value;const b=makeBook(title,theme);const files=[...document.getElementById('bookPhotos').files];if(files.length){b.pages.splice(1,0,...await Promise.all(files.map(async(f,i)=>{const p=makePage('body','Halaman '+(i+1),theme);p.elements.push(imageObj(await readFile(f),12,12,76,58));return p})));b.pages=b.pages.map((p,i)=>{if(p.type==='body'&&!p.elements.length)p.title='Halaman '+(i);return p})}state.books.push(b);currentId=b.id;currentPage=0;selectedId=null;persist();editor()}
function imageObj(src,x=10,y=10,w=80,h=55){return{id:uid('o'),kind:'image',src,x,y,w,h,rotate:0,opacity:1,locked:false,shadow:true,border:0}}
function textObj(text,x=12,y=25,w=76,h=15,size=28,color='#30293d',bold=false){return{id:uid('o'),kind:'text',text,x,y,w,h,size,color,bold,italic:false,align:'left',rotate:0,opacity:1,locked:false,stroke:'#00000000',shadow:false}}
function emojiObj(text,x=38,y=40,w=24,h=15){return{id:uid('o'),kind:'emoji',text,x,y,w,h,size:48,rotate:0,opacity:1,locked:false}}
function editBook(id){currentId=id;currentPage=0;selectedId=null;undoStack=[];redoStack=[];editor()}
function editor(){const b=getBook();if(!b)return home();const p=b.pages[currentPage];const th=THEMES[b.theme];app.innerHTML=`<div class="editor-shell" style="--accent:${th.accent}"><header class="editor-top"><button class="top-tool" onclick="library()">←</button><div class="editor-logo">Digital Book <span>Studio</span></div><div class="editor-title">Edit Buku · ${esc(areaName(p.type))}</div><button class="top-tool undo" onclick="undo()">↶</button><button class="top-tool" onclick="redo()">↷</button><button class="top-tool grid" onclick="toggleGrid()">▦</button><button class="top-tool" onclick="animationScreen()">♫</button><button class="top-tool top-save" onclick="downloadProject('${b.id}')">Simpan</button></header><div class="editor-tabs"><button class="editor-tab ${p.type==='cover'?'active':''}" onclick="jumpType('cover')">📕 Cover Depan</button><button class="editor-tab ${p.type==='body'?'active':''}" onclick="jumpType('body')">📖 Isi Buku</button><button class="editor-tab ${p.type==='back'?'active':''}" onclick="jumpType('back')">📗 Cover Belakang</button></div><main class="editor-main"><aside class="editor-rail"><button class="rail-btn active" onclick="selectTool('object')"><span class="ico">▱</span>Objek</button><button class="rail-btn" onclick="addText()"><span class="ico">T</span>Teks</button><button class="rail-btn" onclick="addPhoto()"><span class="ico">▧</span>Foto</button><button class="rail-btn" onclick="addEmoji()"><span class="ico">☺</span>Stiker</button><button class="rail-btn" onclick="addShape()"><span class="ico">△</span>Shape</button><button class="rail-btn" onclick="backgroundScreen()"><span class="ico">◐</span>Background</button><button class="rail-btn" onclick="themeScreenEditor()"><span class="ico">✦</span>Efek</button><button class="rail-btn" onclick="templatesScreen()"><span class="ico">▦</span>Template</button></aside><section class="canvas-area"><div class="canvas-tools"><button class="canvas-tool" onclick="toggleGrid()">▦ Grid</button><button class="canvas-tool" onclick="autoCover()">✦ Auto Cover</button><button class="canvas-tool" onclick="openThemeModal()">🎨 Auto Theme</button></div><div id="bookStage" class="book-stage" style="background:${p.bg}"></div><div id="objectActions" class="object-actions"></div></section><aside id="propertyPanel" class="property-panel"></aside></main><div class="page-strip">${b.pages.map((pg,i)=>pageThumb(pg,i)).join('')}<button class="page-thumb page-add" onclick="addPage()">＋<span>Tambah<br>Halaman</span></button></div><div class="mobile-tools"><div class="mobile-tool-grid"><button onclick="addText()"><b>T</b>Teks</button><button onclick="addPhoto()"><b>▧</b>Foto</button><button onclick="addEmoji()"><b>☺</b>Stiker</button><button onclick="addShape()"><b>△</b>Shape</button><button onclick="backgroundScreen()"><b>◐</b>BG</button><button onclick="openThemeModal()"><b>✦</b>Tema</button><button onclick="animationScreen()"><b>♫</b>Musik</button><button onclick="reader('${b.id}')"><b>▶</b>Preview</button><button onclick="duplicatePage()"><b>▣</b>Duplikat</button><button onclick="deletePage()"><b>⌫</b>Hapus</button></div></div><nav class="editor-bottom"><button class="editor-nav active"><span class="ico">✎</span>Editor</button><button class="editor-nav" onclick="pageManager()"><span class="ico">▤</span>Halaman</button><button class="editor-nav" onclick="templatesScreen()"><span class="ico">▦</span>Template</button><button class="editor-nav" onclick="openThemeModal()"><span class="ico">🎨</span>Tema</button><button class="editor-nav" onclick="animationScreen()"><span class="ico">♫</span>Animasi & Musik</button><button class="editor-nav" onclick="reader('${b.id}')"><span class="ico">▷</span>Preview</button><button class="editor-nav" onclick="saveBookDevice('${b.id}')"><span class="ico">▣</span>Simpan</button></nav></div>`;renderEditor();}
function areaName(type){return type==='cover'?'Cover Depan':type==='back'?'Cover Belakang':'Isi Buku'}
function pageThumb(pg,i){const b=getBook(),th=THEMES[b.theme];return `<button class="page-thumb ${i===currentPage?'active':''}" onclick="goPage(${i})"><div class="thumb-preview" style="background:${pg.bg};color:${th.text}">${esc(pg.title)}</div>${i===0?'1. Cover Depan':pg.type==='back'?i+'. Cover Belakang':i+'. Halaman '+i}</button>`}
function renderEditor(){const stage=document.getElementById('bookStage'),p=getBook().pages[currentPage];stage.style.background=p.bg;stage.classList.toggle('show-grid',stage.classList.contains('show-grid'));stage.innerHTML=p.elements.map(renderObject).join('');bindObjects();renderObjectPanel()}
function renderObject(o){
  const style=`left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg);`;
  let extra='';
  if(o.kind==='text') extra=`font-size:${o.size||24}px;color:${o.color||'#30293d'};font-weight:${o.bold?'800':'500'};font-style:${o.italic?'italic':'normal'};text-align:${o.align||'left'};text-shadow:${o.shadow?'2px 3px 7px #0004':'none'};`;
  if(o.kind==='shape') extra=`background:${o.fill||'#8b7cf6'};border-radius:${o.radius||18}px;`;
  let body='';
  if(o.kind==='image') body=`<img src="${o.src}" alt="">`;
  else if(o.kind==='emoji') body=esc(o.text);
  else if(o.kind==='text') body=esc(o.text);
  return `<div class="design-object ${o.kind==='text'?'text-object':o.kind==='emoji'?'emoji-object':''}" data-id="${o.id}" style="${style}${extra}">${body}${selectedId===o.id?selectionHandles():''}</div>`;
}
function selectionHandles(){return `<div class="selection"><i class="handle tl" data-handle="tl"></i><i class="handle tm" data-handle="tm"></i><i class="handle tr" data-handle="tr"></i><i class="handle ml" data-handle="ml"></i><i class="handle mr" data-handle="mr"></i><i class="handle bl" data-handle="bl"></i><i class="handle bm" data-handle="bm"></i><i class="handle br" data-handle="br"></i><i class="rotate-stem"></i><i class="handle rot" data-handle="rot"></i></div>`}
function bindObjects(){
  document.querySelectorAll('#bookStage .design-object').forEach(el=>el.addEventListener('pointerdown',startPointer));
  const stage=document.getElementById('bookStage');
  if(stage)stage.addEventListener('pointerdown',stagePointer);
}
function startPointer(e){
  e.stopPropagation();
  const id=this.dataset.id,o=getObject(id);
  if(!o)return;
  const wasSelected=selectedId===id;
  selectedId=id;
  if(!wasSelected){renderEditor();return;}
  if(o.locked)return;
  const handle=e.target.dataset?.handle;
  const r=document.getElementById('bookStage').getBoundingClientRect();
  drag={id,startX:e.clientX,startY:e.clientY,x:o.x,y:o.y,w:o.w,h:o.h,rotate:o.rotate||0,mode:handle?handle:'move',rect:r};
  document.addEventListener('pointermove',movePointer);
  document.addEventListener('pointerup',endPointer,{once:true});
}
function updateDraggedDom(o){
  const el=document.querySelector(`#bookStage .design-object[data-id="${CSS.escape(o.id)}"]`);
  if(!el)return;
  el.style.left=o.x+'%';el.style.top=o.y+'%';el.style.width=o.w+'%';el.style.height=o.h+'%';el.style.transform=`rotate(${o.rotate||0}deg)`;
}
function movePointer(e){
  if(!drag)return;
  const o=getObject(drag.id),r=drag.rect;
  if(!o)return;
  const dx=(e.clientX-drag.startX)/r.width*100,dy=(e.clientY-drag.startY)/r.height*100;
  if(drag.mode==='move'){o.x=clamp(drag.x+dx,0,100-o.w);o.y=clamp(drag.y+dy,0,100-o.h)}
  else if(drag.mode==='br'){o.w=clamp(drag.w+dx,5,100-o.x);o.h=clamp(drag.h+dy,5,100-o.y)}
  else if(drag.mode==='tr'){o.w=clamp(drag.w+dx,5,100-o.x);o.y=clamp(drag.y+dy,0,drag.y+drag.h-5);o.h=clamp(drag.h-dy,5,100-o.y)}
  else if(drag.mode==='bl'){o.x=clamp(drag.x+dx,0,drag.x+drag.w-5);o.w=clamp(drag.w-dx,5,100-o.x);o.h=clamp(drag.h+dy,5,100-o.y)}
  else if(drag.mode==='tl'){o.x=clamp(drag.x+dx,0,drag.x+drag.w-5);o.y=clamp(drag.y+dy,0,drag.y+drag.h-5);o.w=clamp(drag.w-dx,5,100-o.x);o.h=clamp(drag.h-dy,5,100-o.y)}
  else if(drag.mode==='mr'){o.w=clamp(drag.w+dx,5,100-o.x)}
  else if(drag.mode==='ml'){o.x=clamp(drag.x+dx,0,drag.x+drag.w-5);o.w=clamp(drag.w-dx,5,100-o.x)}
  else if(drag.mode==='bm'){o.h=clamp(drag.h+dy,5,100-o.y)}
  else if(drag.mode==='tm'){o.y=clamp(drag.y+dy,0,drag.y+drag.h-5);o.h=clamp(drag.h-dy,5,100-o.y)}
  else if(drag.mode==='rot'){o.rotate=drag.rotate+dx*3}
  updateDraggedDom(o);
}
function endPointer(){
  if(drag){commitHistory();const b=getBook();b.updated=Date.now();persist();renderEditor()}
  document.removeEventListener('pointermove',movePointer);drag=null;
}
function stagePointer(e){if(e.target.id==='bookStage'){selectedId=null;renderEditor()}}

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function getObject(id){return getBook()?.pages[currentPage]?.elements.find(o=>o.id===id)}
function selectObject(id,rerender=true){selectedId=id;if(rerender)renderEditor()}
function renderObjectPanel(){const p=document.getElementById('propertyPanel'),a=document.getElementById('objectActions'),o=getObject(selectedId);if(!o){p.innerHTML=`<div class="prop-tabs"><button class="prop-tab active">Properti</button><button class="prop-tab">Animasi</button><button class="prop-tab">Efek</button></div><div class="empty">Pilih objek di canvas untuk melihat propertinya.</div>`;a.innerHTML='<button onclick="addText()">＋ Teks</button><button onclick="addPhoto()">＋ Foto</button><button onclick="addEmoji()">＋ Stiker</button>';return}p.innerHTML=`<div class="prop-tabs"><button class="prop-tab active">Properti</button><button class="prop-tab" onclick="animationScreen()">Animasi</button><button class="prop-tab" onclick="openEffectModal()">Efek</button></div><div class="prop-section"><div class="prop-title">Properti Objek</div><div class="prop-row"><span style="font-size:20px">${o.kind==='image'?'🖼️':o.kind==='text'?'T':'☺'}</span><b style="font-size:11px">${o.kind==='image'?'Foto':o.kind==='text'?'Teks':'Stiker'}</b></div></div><div class="prop-section"><div class="prop-title">Posisi & Ukuran</div><div class="prop-grid"><input class="prop-field" type="number" value="${o.x.toFixed(1)}" onchange="setObj('x',this.value)"><input class="prop-field" type="number" value="${o.y.toFixed(1)}" onchange="setObj('y',this.value)"><input class="prop-field" type="number" value="${o.w.toFixed(1)}" onchange="setObj('w',this.value)"><input class="prop-field" type="number" value="${o.h.toFixed(1)}" onchange="setObj('h',this.value)"></div><div class="prop-row" style="margin-top:7px"><button class="mini-btn" onclick="nudge(-1,0)">←</button><button class="mini-btn" onclick="nudge(0,-1)">↑</button><button class="mini-btn" onclick="nudge(0,1)">↓</button><button class="mini-btn" onclick="nudge(1,0)">→</button></div></div><div class="prop-section"><div class="prop-title">Rotasi</div><div class="prop-row"><button class="mini-btn" onclick="rotateObject(-15)">↶</button><input class="prop-field" type="number" value="${Math.round(o.rotate||0)}" onchange="setObj('rotate',this.value)"><button class="mini-btn" onclick="rotateObject(15)">↷</button><button class="mini-btn" onclick="rotateObject(90)">90°</button></div></div><div class="prop-section"><div class="prop-title">Opacity</div><input class="range" type="range" min="0" max="1" step=".01" value="${o.opacity??1}" oninput="setObj('opacity',this.value)"></div>${o.kind==='text'?`<div class="prop-section"><div class="prop-title">Teks</div><textarea class="prop-field" rows="3" oninput="setObj('text',this.value)">${esc(o.text)}</textarea><div class="prop-row" style="margin-top:7px"><input class="prop-field" type="number" value="${o.size||24}" onchange="setObj('size',this.value)"><input class="colorbox" type="color" value="${o.color||'#30293d'}" onchange="setObj('color',this.value)"><button class="mini-btn" onclick="setObj('bold',!${!!o.bold})">B</button></div></div>`:''}<div class="prop-section"><div class="prop-title">Layer & Objek</div><div class="prop-row"><button class="mini-btn" onclick="layer(1)">⬆ Front</button><button class="mini-btn" onclick="layer(-1)">⬇ Back</button><button class="mini-btn" onclick="duplicateObject()">⧉ Duplikat</button><button class="mini-btn" onclick="toggleLock()">${o.locked?'🔓 Buka':'🔒 Kunci'}</button><button class="mini-btn" style="color:#b53c5b" onclick="deleteObject()">🗑 Hapus</button></div></div>`;a.innerHTML=`<button onclick="selectAll()">Pilih Semua</button><button onclick="duplicateObject()">Duplikat</button><button onclick="deleteObject()">Hapus</button><button onclick="toggleLock()">${o.locked?'🔓':'🔒'}</button><button onclick="openLayerModal()">Layer</button>`}
function setObj(k,v){const o=getObject(selectedId);if(!o)return;commitHistory();o[k]=(k==='text'||k==='color'||k==='bold')?v:+v;getBook().updated=Date.now();persist();renderEditor()}
function nudge(x,y){const o=getObject(selectedId);if(!o)return;commitHistory();o.x=clamp(o.x+x,0,100-o.w);o.y=clamp(o.y+y,0,100-o.h);persist();renderEditor()}
function rotateObject(n){const o=getObject(selectedId);if(!o)return;commitHistory();o.rotate=(o.rotate||0)+n;persist();renderEditor()}
function layer(dir){const p=getBook().pages[currentPage],i=p.elements.findIndex(o=>o.id===selectedId),j=i+dir;if(i<0||j<0||j>=p.elements.length)return;commitHistory();[p.elements[i],p.elements[j]]=[p.elements[j],p.elements[i]];persist();renderEditor()}
function duplicateObject(){const o=getObject(selectedId);if(!o)return;commitHistory();const n=JSON.parse(JSON.stringify(o));n.id=uid('o');n.x=clamp(n.x+4,0,100-n.w);n.y=clamp(n.y+4,0,100-n.h);getBook().pages[currentPage].elements.push(n);selectedId=n.id;persist();renderEditor()}
function deleteObject(){const p=getBook().pages[currentPage],i=p.elements.findIndex(o=>o.id===selectedId);if(i<0)return;commitHistory();p.elements.splice(i,1);selectedId=null;persist();renderEditor()}
function toggleLock(){const o=getObject(selectedId);if(!o)return;commitHistory();o.locked=!o.locked;persist();renderEditor()}
function selectAll(){const p=getBook().pages[currentPage];selectedId=p.elements[0]?.id||null;renderEditor()}
function openLayerModal(){openModal(`<h3>Layer</h3><button class="primary full" onclick="layer(1);closeModal()">⬆ Bawa ke depan</button><button class="mini-btn" style="width:100%;margin-top:8px;padding:12px" onclick="layer(-1);closeModal()">⬇ Kirim ke belakang</button>`)}
function addText(){const b=getBook();if(!b)return;commitHistory();const o=textObj(b.title,12,28,76,14,28,THEMES[b.theme].text,true);b.pages[currentPage].elements.push(o);selectedId=o.id;b.updated=Date.now();persist();renderEditor()}
function addEmoji(){commitHistory();const o=emojiObj('💗');getBook().pages[currentPage].elements.push(o);selectedId=o.id;persist();renderEditor()}
function addShape(){commitHistory();const o={id:uid('o'),kind:'shape',x:15,y:25,w:70,h:25,fill:THEMES[getBook().theme].accent,radius:18,opacity:.9,rotate:0,locked:false};getBook().pages[currentPage].elements.push(o);selectedId=o.id;persist();renderEditor()}
function addPhoto(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;commitHistory();const o=imageObj(await readFile(i.files[0]),12,18,76,50);getBook().pages[currentPage].elements.push(o);selectedId=o.id;persist();renderEditor()};i.click()}
function addPage(){const b=getBook();commitHistory();const n=b.pages.filter(p=>p.type==='body').length+1,p=makePage('body','Halaman '+n,b.theme);b.pages.splice(Math.max(1,b.pages.length-1),0,p);currentPage=Math.max(1,b.pages.length-2);selectedId=null;persist();editor()}
function deletePage(){const b=getBook();if(b.pages[currentPage].type!=='body')return alert('Cover Depan dan Cover Belakang tidak dapat dihapus.');if(b.pages.filter(p=>p.type==='body').length<=1)return alert('Minimal satu halaman isi harus ada.');commitHistory();b.pages.splice(currentPage,1);currentPage=Math.max(0,currentPage-1);selectedId=null;persist();editor()}
function duplicatePage(){const b=getBook();commitHistory();const copy=JSON.parse(JSON.stringify(b.pages[currentPage]));copy.id=uid('p');copy.title='Salinan halaman';b.pages.splice(currentPage+1,0,copy);currentPage++;persist();editor()}
function goPage(i){currentPage=i;selectedId=null;editor()}
function jumpType(type){const b=getBook(),i=b.pages.findIndex(p=>p.type===type);if(i>=0)goPage(i)}
function pageManager(){openModal(`<h3>Kelola Halaman</h3><button class="primary full" onclick="addPage();closeModal()">＋ Tambah Halaman</button><button class="mini-btn" style="width:100%;margin-top:8px;padding:12px" onclick="duplicatePage();closeModal()">⧉ Duplikat Halaman</button><button class="mini-btn" style="width:100%;margin-top:8px;padding:12px" onclick="deletePage();closeModal()">⌫ Hapus Halaman</button>`)}
function backgroundScreen(){const b=getBook();openModal(`<h3>Background</h3><div class="theme-grid">${Object.entries(THEMES).map(([k,t])=>`<button class="theme-card" onclick="setPageBg('${k}');closeModal()"><div class="swatches"><i class="swatch" style="background:${t.bg}"></i><i class="swatch" style="background:${t.accent}"></i></div><b>${t.name}</b></button>`).join('')}</div><label class="label">Warna custom</label><input class="colorbox" style="width:100%" type="color" value="${b.pages[currentPage].bg.startsWith('#')?b.pages[currentPage].bg:'#ffffff'}" onchange="customBg(this.value)">`)}
function setPageBg(k){commitHistory();getBook().pages[currentPage].bg=THEMES[k].bg;persist();editor()}
function customBg(v){commitHistory();getBook().pages[currentPage].bg=v;persist();editor()}
function openThemeModal(){const b=getBook();openModal(`<h3>Auto Theme</h3><p class="muted">Tema mengubah latar, warna teks, aksen, dan nuansa editor buku.</p><div class="theme-grid">${Object.entries(THEMES).map(([k,t])=>`<button class="theme-card ${b.theme===k?'active':''}" onclick="applyTheme('${k}');closeModal()"><div class="swatches"><i class="swatch" style="background:${t.bg}"></i><i class="swatch" style="background:${t.accent}"></i><i class="swatch" style="background:${t.soft}"></i></div><b>${t.name}</b></button>`).join('')}</div>`)}
function themeScreen(){createScreen()}
function themeScreenEditor(){openThemeModal()}
function applyTheme(k){const b=getBook();commitHistory();b.theme=k;b.pages.forEach(p=>{p.bg=THEMES[k].bg;p.elements.forEach(o=>{if(o.kind==='text'&&(!o.color||o.color==='#30293d'))o.color=THEMES[k].text})});persist();editor()}
function autoCover(){const b=getBook(),t=THEMES[b.theme],p=b.pages[0];commitHistory();p.bg=`linear-gradient(145deg,${t.accent},${t.bg})`;p.elements=[textObj(b.title,10,38,80,16,34,'#fff',true),textObj('A special chapter of my life',14,55,72,10,15,'#fff',false)];p.elements[1].opacity=.9;selectedId=p.elements[0].id;persist();editor()}
function openEffectModal(){openModal(`<h3>Efek</h3><button class="mini-btn" style="width:100%;padding:12px" onclick="toggleShadow();closeModal()">Bayangan</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="setRadius();closeModal()">Sudut / Radius</button>`)}
function toggleShadow(){const o=getObject(selectedId);if(!o)return;commitHistory();o.shadow=!o.shadow;persist();renderEditor()}
function setRadius(){const o=getObject(selectedId);if(!o)return;const n=prompt('Radius sudut (px):',o.radius||18);if(n!==null){commitHistory();o.radius=+n;persist();renderEditor()}}
function toggleGrid(){document.getElementById('bookStage')?.classList.toggle('show-grid');const s=document.createElement('style');s.id='gridStyle';s.textContent='.show-grid{background-image:linear-gradient(#8b7cf61a 1px,transparent 1px),linear-gradient(90deg,#8b7cf61a 1px,transparent 1px);background-size:10% 10%;}';if(!document.getElementById('gridStyle'))document.head.appendChild(s)}
function selectTool(){}
function animationScreen(){const b=getBook();app.innerHTML=`<div class="animation-page"><div class="anim-head"><button class="glass" onclick="editor()">←</button><h2>Animasi & Musik</h2><button class="glass" onclick="reader('${b.id}')">▶</button></div><div class="anim-preview"><div class="anim-sky"></div><div class="anim-book">${esc(b.title)}<small style="display:block;font:10px system-ui;margin-top:9px">By Digital Book Studio</small></div></div><div class="anim-controls"><div class="control-line"><span>Latar bergerak</span><select id="animBg"><option value="sunset">Sunset Seascape</option><option value="paper">Paper Particles</option><option value="cloud">Soft Clouds</option><option value="night">Night Sky</option></select></div><div class="control-line"><span>Animasi buku</span><select id="entrance"><option value="rise">Book Rise</option><option value="fade">Fade In</option><option value="slide">Slide Up</option><option value="zoom">Zoom In</option></select></div><div class="control-line"><span>Transisi halaman</span><select id="transition"><option value="slide">Slide</option><option value="turn">Page Turn</option><option value="fade">Fade</option><option value="push">Push</option></select></div><div class="control-line"><span>Kecepatan</span><input id="speed" type="range" min=".5" max="2" step=".1" value="${b.animation.speed}"></div><div class="control-line"><span>Durasi cover</span><input id="duration" type="range" min="1" max="8" step=".5" value="${b.animation.coverDuration}"></div><div class="music-card"><b>🎵 Musik Buku</b><small>${esc(b.music?.name||'Belum ada musik')}</small><div class="music-actions"><label class="play">＋ Pilih Musik<input id="musicFile" type="file" accept="audio/*" style="display:none"></label><button onclick="previewMusic()">▶ Preview</button><button onclick="stopAudio()">■ Stop</button></div></div><button class="anim-save" onclick="saveAnimationSettings()">Simpan Pengaturan & Preview →</button></div></div>`;document.getElementById('musicFile').addEventListener('change',async e=>{const f=e.target.files[0];if(f)b.music={name:f.name,src:await readFile(f)}})}
async function saveAnimationSettings(){const b=getBook();b.animation={background:document.getElementById('animBg').value,entrance:document.getElementById('entrance').value,transition:document.getElementById('transition').value,speed:+document.getElementById('speed').value,coverDuration:+document.getElementById('duration').value};b.updated=Date.now();persist();reader(b.id)}
function previewMusic(){const b=getBook();if(!b?.music)return alert('Pilih musik terlebih dahulu.');stopAudio();audio=new Audio(b.music.src);audio.loop=true;audio.play().catch(()=>alert('Tekan tombol play di browser untuk memulai audio.'))}
function stopAudio(){if(audio){audio.pause();audio.currentTime=0;audio=null}}
function reader(id){const b=state.books.find(x=>x.id===id);if(!b)return;stopAudio();currentId=id;readerPage=Math.min(currentPage,b.pages.length-1);const p=b.pages[readerPage];app.innerHTML=`<div class="reader"><div class="reader-bg"></div><div class="reader-top"><button class="glass" onclick="editor()">←</button><span class="reader-label">${esc(areaName(p.type))} · ${readerPage+1} / ${b.pages.length}</span><button class="glass" onclick="toggleFullscreen()">⛶</button></div><div class="reader-nav"><button class="reader-arrow" onclick="readerMove(-1)">‹</button><button class="reader-arrow" onclick="readerMove(1)">›</button></div><div class="reader-book"><div id="readerStage" class="reader-stage" style="background:${p.bg}"></div></div><div class="reader-music"><b>🎵 ${esc(b.music?.name||'Musik Buku')}</b><small>Lagu pengiring untuk setiap halaman</small><div class="progress"><span id="readerProgress"></span></div><div class="reader-controls"><span>${readerPage+1} / ${b.pages.length}</span><span><button onclick="toggleReaderAudio()">▶</button> 🔊</span></div></div></div>`;renderReader();if(b.music){audio=new Audio(b.music.src);audio.loop=true;audio.play().catch(()=>{})}}
function renderReader(){const b=getBook();if(!b)return;const p=b.pages[readerPage],s=document.getElementById('readerStage');if(!s)return;s.style.background=p.bg;s.innerHTML=p.elements.map(o=>{const st=`position:absolute;left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg);`;if(o.kind==='image')return `<div style="${st}"><img src="${o.src}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;if(o.kind==='shape')return `<div style="${st}background:${o.fill||'#8b7cf6'};border-radius:${o.radius||18}px;"></div>`;return `<div style="${st}font-size:${o.size||24}px;color:${o.color||'#30293d'};font-weight:${o.bold?'800':'500'};font-style:${o.italic?'italic':'normal'};text-align:${o.align||'left'};">${esc(o.text||'')}</div>`}).join('');const pr=document.getElementById('readerProgress');if(pr)pr.style.width=((readerPage+1)/b.pages.length*100)+'%'}
function readerMove(d){const b=getBook();readerPage=clamp(readerPage+d,0,b.pages.length-1);renderReader();const label=document.querySelector('.reader-label');if(label)label.textContent=`${areaName(b.pages[readerPage].type)} · ${readerPage+1} / ${b.pages.length}`}
function toggleReaderAudio(){if(!audio){const b=getBook();if(!b?.music)return alert('Buku ini belum memiliki musik.');audio=new Audio(b.music.src);audio.loop=true}if(audio.paused)audio.play();else audio.pause()}
function toggleFullscreen(){document.documentElement.requestFullscreen?.()}
function saveBookDevice(id){downloadProject(id);alert('Project buku disimpan ke perangkat sebagai file .digitalbook.json')}
function downloadProject(id){const b=state.books.find(x=>x.id===id);if(!b)return;const blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'});downloadBlob(blob,safeName(b.title)+'.digitalbook.json')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadReadable(id){const b=state.books.find(x=>x.id===id);if(!b)return;const pages=b.pages.map((p,i)=>`<article style="position:relative;width:min(90vw,520px);aspect-ratio:3/4;margin:25px auto;background:${p.bg};overflow:hidden;box-shadow:0 15px 40px #0002"><h3 style="position:absolute;left:5%;top:3%;z-index:3;font:12px system-ui;opacity:.6">${esc(p.title)}</h3>${p.elements.map(o=>o.kind==='image'?`<img src="${o.src}" style="position:absolute;left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;object-fit:cover;opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg)">`:o.kind==='shape'?`<div style="position:absolute;left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;background:${o.fill||'#8b7cf6'};border-radius:${o.radius||18}px;opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg)"></div>`:`<div style="position:absolute;left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;font-size:${o.size||24}px;color:${o.color||'#30293d'};font-weight:${o.bold?'800':'500'};font-style:${o.italic?'italic':'normal'};opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg)">${esc(o.text||'')}</div>`).join('')}</article>`).join('');const html=`<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${esc(b.title)}</title><body style="margin:0;background:#171426;padding:15px;font-family:system-ui">${pages}</body></html>`;downloadBlob(new Blob([html],{type:'text/html'}),safeName(b.title)+'.html')}
function library(){stopAudio();app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="home()">‹</button><h2>Perpustakaan</h2><button class="mini-btn" onclick="importProject()">📥 Import</button></div><div class="page-content"><div class="section-head" style="padding:0"><div><b>${state.books.length} Buku</b><div class="muted">Disimpan otomatis di perangkat</div></div><button class="primary" style="padding:11px 14px;font-size:12px" onclick="createScreen()">＋ Baru</button></div><div class="library-grid" style="margin-top:12px">${state.books.length?state.books.slice().reverse().map(libraryCard).join(''):'<div class="empty">Perpustakaan masih kosong.<br>Buat buku pertamamu.</div>'}</div></div></div>${bottomNav('library')}`}
function libraryCard(b){const t=THEMES[b.theme];return `<div class="library-card"><div class="library-cover" style="background:${t.bg};color:${t.text}">${esc(b.title)}</div><div class="library-info"><b>${esc(b.title)}</b><small>${b.pages.length} halaman · ${t.name}</small><div class="mini-actions"><button class="mini-btn" onclick="editBook('${b.id}')">✎ Edit</button><button class="mini-btn" onclick="reader('${b.id}')">▶ Baca</button><button class="mini-btn green" onclick="downloadProject('${b.id}')">💾 Simpan</button><button class="mini-btn" onclick="downloadReadable('${b.id}')">📕 Buku</button><button class="mini-btn" onclick="bookOptions('${b.id}')">⋮</button></div></div></div>`}
function bookOptions(id){const b=state.books.find(x=>x.id===id);openModal(`<h3>${esc(b.title)}</h3><button class="primary full" onclick="downloadProject('${id}');closeModal()">💾 Simpan Project</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="downloadReadable('${id}');closeModal()">📕 Simpan Buku HTML</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="renameBook('${id}');closeModal()">✎ Ganti Judul</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px;color:#b53c5b" onclick="deleteBook('${id}');closeModal()">🗑 Hapus Buku</button>`)}
function renameBook(id){const b=state.books.find(x=>x.id===id);const n=prompt('Judul baru:',b.title);if(n?.trim()){b.title=n.trim();b.updated=Date.now();persist();library()}}
function deleteBook(id){if(!confirm('Hapus buku ini dari perangkat?'))return;state.books=state.books.filter(b=>b.id!==id);persist();library()}
function importProject(){const i=document.createElement('input');i.type='file';i.accept='.json,.digitalbook.json,application/json';i.onchange=async()=>{try{const b=JSON.parse(await readFile(i.files[0]));if(!b||!Array.isArray(b.pages))throw Error();b.id=uid('book');b.updated=Date.now();state.books.push(b);persist();library()}catch{alert('File project tidak valid.')}};i.click()}
function showSettings(){openModal(`<h3>Digital Book Studio</h3><p class="muted">Buku disimpan otomatis di penyimpanan browser perangkat ini.</p><button class="mini-btn" style="width:100%;padding:12px" onclick="importProject();closeModal()">📥 Import Project</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="library();closeModal()">📚 Perpustakaan</button>`)}
function openModal(content){modal.className='';modal.innerHTML=`<div style="position:fixed;inset:0;background:#0006;z-index:100;display:grid;align-items:end"><div style="width:min(520px,100%);max-height:82vh;overflow:auto;background:#fffaf5;border-radius:26px 26px 0 0;padding:18px"><button class="backbtn" style="float:right" onclick="closeModal()">×</button>${content}<button class="mini-btn" style="width:100%;padding:12px;margin-top:12px" onclick="closeModal()">Tutup</button></div></div>`}
function closeModal(){modal.className='hidden';modal.innerHTML=''}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function commitHistory(){const b=getBook();if(!b)return;undoStack.push(JSON.stringify(b));if(undoStack.length>30)undoStack.shift();redoStack=[]}
function undo(){const b=getBook();if(!b||!undoStack.length)return;redoStack.push(JSON.stringify(b));const prev=JSON.parse(undoStack.pop());const idx=state.books.findIndex(x=>x.id===b.id);state.books[idx]=prev;currentPage=Math.min(currentPage,prev.pages.length-1);selectedId=null;persist();editor()}
function redo(){const b=getBook();if(!b||!redoStack.length)return;undoStack.push(JSON.stringify(b));const next=JSON.parse(redoStack.pop());const idx=state.books.findIndex(x=>x.id===b.id);state.books[idx]=next;currentPage=Math.min(currentPage,next.pages.length-1);selectedId=null;persist();editor()}
function openUpload(){openUploadFlow()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
home();
</script>
</body></html>
